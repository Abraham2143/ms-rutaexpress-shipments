spring.application.name=ms-rutaexpress-shipments
server.port=${SERVER_PORT:8081}

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false

rutaexpress.catalog.base-url=${CATALOG_BASE_URL:http://localhost:8082}
rutaexpress.catalog.capacity-path=${CATALOG_CAPACITY_PATH:/api/catalog/services/{serviceId}/capacity/decrement}
rutaexpress.catalog.connect-timeout=${CATALOG_CONNECT_TIMEOUT:3s}
rutaexpress.catalog.read-timeout=${CATALOG_READ_TIMEOUT:10s}

spring.security.oauth2.resourceserver.jwt.issuer-uri=${AZURE_ISSUER_URI}
rutaexpress.security.audience=${AZURE_AUDIENCE}
rutaexpress.security.jwk-set-uri=${AZURE_JWK_SET_URI:}

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never


# Producer only. Topology is owned by ms-rutaexpress-rabbitmq-admin.
spring.rabbitmq.dynamic=false
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME}
spring.rabbitmq.password=${RABBITMQ_PASSWORD}
spring.rabbitmq.virtual-host=${RABBITMQ_VHOST:/}
spring.rabbitmq.connection-timeout=5s

# Kafka producer (optional, off by default). Topics are owned by ms-rutaexpress-audit (kafka-admin).
# Publishes every shipment creation/status change to the topic consumed by kafka-analytics.
rutaexpress.kafka.enabled=${KAFKA_ENABLED:false}
rutaexpress.kafka.shipments-topic=${KAFKA_TOPIC_SHIPMENTS:rutaexpress.shipments.events.v1}
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
# Without a reachable broker, send() waits at most this long instead of the 60 s default.
spring.kafka.producer.properties.max.block.ms=${KAFKA_MAX_BLOCK_MS:5000}
spring.kafka.producer.properties.request.timeout.ms=15000
spring.kafka.producer.properties.delivery.timeout.ms=30000
